<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear pedido | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Crear pedido</h1>
                <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver</a>
            </header>
            <form th:action="@{/pedidos/crear}" th:object="${pedido}" method="post" class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="total">Total</label>
                    <input class="form-control" id="total" th:field="*{total}" type="number" min="0" step="0.01" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="fecha">Fecha</label>
                    <input class="form-control" id="fecha" th:field="*{fecha}" type="date">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="clienteId">Cliente</label>
                    <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                        <option value="">Selecciona un cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                                th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="comercialId">Comercial</label>
                    <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                        <option value="">Selecciona un comercial</option>
                        <option th:each="comercial : ${comerciales}" th:value="${comercial.id}"
                                th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('comercialId')}" th:errors="*{comercialId}"></div>
                </div>
                <div class="col-12 d-flex gap-2 pt-2">
                    <button class="btn btn-primary" type="submit">Guardar pedido</button>
                    <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
