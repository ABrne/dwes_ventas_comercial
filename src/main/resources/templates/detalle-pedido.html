<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de pedido | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Detalle de pedido</h1>
                <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver al listado</a>
            </header>
            <dl class="row g-0 border-top">
                <dt class="col-5 col-md-4 py-3 border-bottom">Id</dt><dd class="col-7 col-md-8 py-3 border-bottom mb-0" th:text="${pedido.id}"></dd>
                <dt class="col-5 col-md-4 py-3 border-bottom">Total</dt><dd class="col-7 col-md-8 py-3 border-bottom mb-0" th:text="${pedido.total}"></dd>
                <dt class="col-5 col-md-4 py-3 border-bottom">Fecha</dt><dd class="col-7 col-md-8 py-3 border-bottom mb-0" th:text="${pedido.fecha != null ? #temporals.format(pedido.fecha, 'dd/MM/yyyy') : '-'}"></dd>
                <dt class="col-5 col-md-4 py-3 border-bottom">Cliente</dt><dd class="col-7 col-md-8 py-3 border-bottom mb-0" th:text="${pedido.nombreCliente}"></dd>
                <dt class="col-5 col-md-4 py-3 border-bottom">Comercial</dt><dd class="col-7 col-md-8 py-3 border-bottom mb-0" th:text="${pedido.nombreComercial}"></dd>
            </dl>
            <a class="btn btn-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar pedido</a>
        </div>
    </div>
</main>
</body>
</html>
