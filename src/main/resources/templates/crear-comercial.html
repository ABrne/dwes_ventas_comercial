<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear comercial | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Crear comercial</h1>
                <a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver</a>
            </header>
            <form th:action="@{/comerciales/crear}" th:object="${comercial}" method="post" class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="apellido1">Primer apellido</label>
                    <input class="form-control" id="apellido1" th:field="*{apellido1}" maxlength="100" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="apellido2">Segundo apellido</label>
                    <input class="form-control" id="apellido2" th:field="*{apellido2}" maxlength="100">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="comision">Comisión (0 a 1)</label>
                    <input class="form-control" id="comision" th:field="*{comision}" type="number" min="0" max="1" step="0.01">
                </div>
                <div class="col-12 d-flex gap-2 pt-2">
                    <button class="btn btn-primary" type="submit">Guardar comercial</button>
                    <a class="btn btn-outline-secondary" th:href="@{/comerciales}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
